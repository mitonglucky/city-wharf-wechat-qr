<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07c160">
  <meta name="description" content="Join the City Wharf WeChat Group.">
  <title>City Wharf WeChat Group</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="wechat-mark" aria-hidden="true">
        <svg viewBox="0 0 64 52" role="img">
          <path d="M28 3C13.6 3 2 12.2 2 23.5c0 6.6 3.8 12.5 9.8 16.2l-2.2 8.1 10-5.1c2.6.7 5.4 1.1 8.4 1.1 14.4 0 26-9.2 26-20.5S42.4 3 28 3Z" fill="white"/>
          <path d="M42 21c11.1 0 20 6.9 20 15.4 0 4.8-3 9.1-7.7 11.9l1.5 5.7-7.1-3.6c-2.1.8-4.4 1.3-6.7 1.3-11 0-20-6.9-20-15.4S31 21 42 21Z" fill="#d9f8e8"/>
          <circle cx="20" cy="22" r="2.6" fill="#07c160"/>
          <circle cx="34" cy="22" r="2.6" fill="#07c160"/>
          <circle cx="37" cy="37" r="2.2" fill="#07c160"/>
          <circle cx="49" cy="37" r="2.2" fill="#07c160"/>
        </svg>
      </div>
      <h1 id="title">City Wharf</h1>
      <p class="subtitle">WeChat Group</p>
      <p class="intro">Scan the group QR code below in WeChat to join us.</p>
      <div class="qr-frame">
        <img id="group-qr" src="assets/group-qr.png" alt="Current City Wharf WeChat group QR code">
      </div>
      <p class="hint">Open this page in WeChat, then scan or save the group QR code.</p>
      <p class="updated" id="updated">QR code last updated: <span id="updated-date">Please check the latest QR code</span></p>
    </section>
    <footer>City Wharf · WeChat Group</footer>
  </main>
  <script src="config.js"></script>
</body>
</html>
